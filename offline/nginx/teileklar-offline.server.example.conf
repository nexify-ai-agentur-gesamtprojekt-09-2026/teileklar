# BEISPIEL – so sieht der bestehende server-Block nach dem Cutover aus.
# Diese Datei wird NICHT eingebunden. Sie zeigt nur, wo die drei neuen Zeilen
# stehen. Alle Werte in spitzen Klammern stammen aus der bisherigen
# Konfiguration des Servers und bleiben unverändert.

server {
    listen 443 ssl;                              # <unverändert übernehmen>
    server_name teileklar.shop www.teileklar.shop;   # <unverändert übernehmen>

    # ssl_certificate      <unverändert>;
    # ssl_certificate_key  <unverändert>;
    # weitere ssl_*-, log- und add_header-Zeilen: <unverändert>

    # --- NEU: Offline-Zustand -------------------------------------------------
    set $tk_offline_root  /var/www/teileklar-offline;
    set $tk_api_upstream  http://127.0.0.1:8905;   # Annahme: bisherige proxy_pass-Adresse prüfen
    include /etc/nginx/snippets/teileklar-offline.conf;
    # --------------------------------------------------------------------------

    # ALLE bisherigen location-Blöcke dieses server-Blocks sind auskommentiert:
    # location / { ... }
    # location /api/ { ... }
    # ...
}

# Ein bestehender server-Block für Port 80 (Weiterleitung auf https) bleibt,
# wie er ist. Hinter Cloudflare ist unbekannt, ob er überhaupt erreicht wird.
