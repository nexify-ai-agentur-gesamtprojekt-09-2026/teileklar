# =============================================================================
# TEILEKLAR.shop – Offline-Regelblock für nginx (Allowlist)
# =============================================================================
#
# Einbindung: per "include" INNERHALB des bestehenden server-Blocks für
# teileklar.shop und www.teileklar.shop (bei zwei getrennten server-Blöcken in
# beiden). Ein vollständiges Beispiel steht in teileklar-offline.server.example.conf.
#
# Dieser Block ERSETZT alle bisherigen "location"-Blöcke des server-Blocks.
# Die bisherigen location-Blöcke müssen auskommentiert oder entfernt werden;
# bleibt einer stehen (z. B. "location /"), meldet "nginx -t" einen Fehler
# ("duplicate location") und es wird nichts geändert. listen, server_name und
# alle ssl_*-Zeilen bleiben unverändert stehen.
#
# Voraussetzung im einbindenden server-Block (vor dem include):
#
#     set $tk_offline_root  /var/www/teileklar-offline;
#     set $tk_api_upstream  http://127.0.0.1:8905;
#
# Fehlt eine der beiden Variablen, scheitert "nginx -t" ("unknown variable").
#
# Erwartete Dateien unter $tk_offline_root:
#
#     offline.html                  (aus offline/offline.html)
#     sw.js                         (aus offline/sw.js)
#     favicon.svg                   (aus offline/favicon.svg)
#     _tk/fonts/archivo-latin-wght-normal.woff2          (aus offline/fonts/)
#     _tk/fonts/ibm-plex-mono-latin-500-normal.woff2     (aus offline/fonts/)
#     _tk/og.jpg                    (aus offline/og.jpg)
#     robots.txt                    (aus offline/robots.txt)
#     sitemap.xml                   (aus offline/sitemap.xml)
#     .well-known/security.txt      (Kopie der bisherigen Datei)
#     legal/impressum.html          (nur Variante B, siehe unten)
#     legal/datenschutz.html
#     legal/agb.html
#     legal/widerruf.html
#     legal/versand.html
#
# -----------------------------------------------------------------------------
# ANNAHMEN (die echte nginx-Konfiguration des Servers ist NICHT bekannt)
# -----------------------------------------------------------------------------
# A1  Die API läuft unter http://127.0.0.1:8905 und erwartet den Pfad
#     /api/revolut/webhook unverändert (kein Präfix wird abgeschnitten).
#     Vor Ort prüfen: bisherige proxy_pass-Zeile für /api/ ansehen.
# A2  Die bisherigen proxy_set_header-Zeilen sind unbekannt. Unten stehen
#     übliche Werte. Vor Ort durch die bisherigen Zeilen ersetzen, damit der
#     Webhook exakt wie bisher beim Dienst ankommt.
# A3  Beide Hostnamen werden vom selben server-Block (oder von zwei gleich
#     aufgebauten) bedient. Es gibt heute keine Weiterleitung von www.
# A4  Sicherheits-Header (Strict-Transport-Security, Content-Security-Policy
#     usw.) kommen heute mit jeder Antwort. Woher sie stammen, ist unbekannt.
#     Stehen sie als "add_header" im server-Block, gelten sie NICHT in den
#     location-Blöcken unten, weil jede location eigene add_header-Zeilen hat
#     (nginx vererbt add_header nur, wenn die Ebene selbst keine setzt).
#     Dann die Zeilen in eine eigene Datei legen und unten an den mit
#     "SICHERHEITS-HEADER" markierten Stellen per include einbinden.
# A5  Die Rechtsseiten werden heute vermutlich vom API-Dienst geliefert
#     (Antworten ohne ETag/Last-Modified). Belegt ist das nicht. Deshalb gibt
#     es zwei Varianten, siehe Abschnitt "Rechtsseiten".
# A6  Der bisherige Service Worker ist auch unter den Marktpfaden abrufbar
#     (/de/sw.js, /at/sw.js, /lu/sw.js am 22.11.2026 mit 200 geprüft). Deshalb
#     wird der Abschalt-Service-Worker auch dort ausgeliefert.
# A7  Geprüft wurde die Syntax mit nginx 1.24.0; der Server meldet 1.28.3.
#     "nginx -t" auf dem Server ist deshalb Pflicht.
# =============================================================================

# Alle 503-Antworten für Seiten liefern die Offline-Seite als Inhalt.
# Die Umleitung auf eine Adresse (statt auf eine benannte location) ist Absicht:
# Dabei wird die Methode intern auf GET gesetzt, sonst würde nginx auf POST mit
# einer statischen Datei 405 statt 503 antworten.
error_page 503 /__tk_offline_503.html;

location = /__tk_offline_503.html {
    internal;
    root $tk_offline_root;
    try_files /offline.html =500;
    default_type text/html;
    charset utf-8;
    add_header Retry-After     86400      always;
    add_header Cache-Control   "no-store" always;
    add_header X-Robots-Tag    "noindex"  always;
    # SICHERHEITS-HEADER (siehe A4): include snippets/teileklar-sicherheits-header.conf;
}

location = /__tk_offline_503.json {
    internal;
    default_type application/json;
    add_header Retry-After     86400      always;
    add_header Cache-Control   "no-store" always;
    add_header X-Robots-Tag    "noindex"  always;
    # SICHERHEITS-HEADER (siehe A4)
    return 503 '{"status":503,"error":"service_unavailable","message":"TEILEKLAR.shop ist vorübergehend nicht verfügbar."}';
}

# -----------------------------------------------------------------------------
# 200: Startseite = Offline-Seite
# -----------------------------------------------------------------------------
location = / {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /offline.html =503;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control   "no-store" always;
    add_header X-Robots-Tag    "noindex"  always;
    # SICHERHEITS-HEADER (siehe A4)
}

# -----------------------------------------------------------------------------
# 200: statische Dateien des Offline-Zustands
# -----------------------------------------------------------------------------
location = /robots.txt {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /robots.txt =503;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
}

location = /sitemap.xml {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /sitemap.xml =503;
    default_type application/xml;
    add_header Cache-Control "no-cache" always;
}

location = /.well-known/security.txt {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /.well-known/security.txt =503;
    default_type text/plain;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
}

# Abschalt-Service-Worker: Hauptpfad und Marktpfade (siehe A6).
# "no-store", damit Browser bei der Aktualisierungsprüfung immer diese Datei laden.
location ~ ^/(?:(?:de|at|ch|nl|be-nl|be-fr|lu)/)?sw\.js$ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /sw.js =503;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
}

# Eigenes Icon. /favicon.ico liefert dasselbe SVG direkt (keine Weiterleitung,
# kein Binärformat). "types { }" erzwingt image/svg+xml für beide Adressen.
location ~ ^/favicon\.(?:svg|ico)$ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /favicon.svg =503;
    types { }
    default_type image/svg+xml;
    add_header Cache-Control "public, max-age=86400" always;
}

# Eigene Schriften der Coming-Soon-Seite (SIL Open Font License). Feste Namen,
# deshalb lange Cache-Dauer; bei neuer Schriftdatei den Dateinamen ändern.
location ~ ^/_tk/fonts/(?:archivo-latin-wght-normal|ibm-plex-mono-latin-500-normal)\.woff2$ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files $uri =503;
    types { }
    default_type font/woff2;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Eigenes Vorschaubild für geteilte Links.
location = /_tk/og.jpg {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    root $tk_offline_root;
    try_files /_tk/og.jpg =503;
    types { }
    default_type image/jpeg;
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Kein Rasterbild vorhanden: ehrliches 404 statt 503 mit HTML-Körper.
location ~ ^/apple-touch-icon(?:-precomposed)?\.png$ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag  "noindex"  always;
    return 404;
}

# -----------------------------------------------------------------------------
# 200: Rechtsseiten  /impressum /datenschutz /agb /widerruf /versand
# -----------------------------------------------------------------------------
# Genau EINE der beiden Varianten ist aktiv.
#
# Variante B (aktiv): statische Kopien unter $tk_offline_root/legal/<name>.html.
#   + unabhängig vom API-Dienst und von dessen Routen
#   - die Kopien müssen VOR dem Cutover erzeugt und geprüft werden
#     (RUNBOOK, Schritt 2.7); fehlt eine Kopie, antwortet der Pfad mit 503.
#   Vor Ort prüfen: Die Kopien direkt am Ursprung ziehen (nicht über
#   Cloudflare), sonst enthält die Kopie von Cloudflare umgeschriebene
#   E-Mail-Verweise.
#
# Variante A (auskommentiert): Durchreichen an die bisherige Auslieferung.
#   + exakt der bisherige Inhalt, keine Kopie nötig
#   - der API-Dienst bleibt für diese fünf Pfade öffentlich erreichbar
#   Vor Ort prüfen: Wie wurden die Rechtsseiten bisher ausgeliefert
#   (proxy_pass an den Dienst oder Dateien aus dem Webroot)? Bei Dateien aus
#   dem Webroot statt proxy_pass die bisherigen root/try_files-Zeilen einsetzen.
location ~ ^/(?<tk_rechtsseite>impressum|datenschutz|agb|widerruf|versand)$ {
    if ($request_method !~ ^(?:GET|HEAD)$) { return 503; }

    # --- Variante B: statische Kopie ---
    root $tk_offline_root;
    try_files /legal/$tk_rechtsseite.html =503;
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-cache" always;
    # SICHERHEITS-HEADER (siehe A4)

    # --- Variante A: Durchreichen (dazu die Zeilen von Variante B auskommentieren) ---
    # proxy_pass $tk_api_upstream;
    # proxy_set_header Host              $host;
    # proxy_set_header X-Real-IP         $remote_addr;
    # proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # proxy_set_header X-Forwarded-Proto $scheme;
}

# -----------------------------------------------------------------------------
# Durchgereicht: Zahlungs-Webhook (nur POST)
# -----------------------------------------------------------------------------
# Bestehende Zahlungs-, Erstattungs- und Streitfall-Meldungen des
# Zahlungsdienstes müssen weiter ankommen. Inhalt, Kopfzeilen (Signatur) und
# Antwort des Dienstes werden nicht verändert. Antwortet der Dienst nicht,
# liefert nginx 502/504 – der Zahlungsdienst wiederholt dann die Zustellung.
location = /api/revolut/webhook {
    error_page 503 /__tk_offline_503.json;
    if ($request_method != POST) { return 503; }

    proxy_pass $tk_api_upstream;                                   # Annahme A1
    proxy_set_header Host              $host;                      # Annahme A2
    proxy_set_header X-Real-IP         $remote_addr;               # Annahme A2
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for; # Annahme A2
    proxy_set_header X-Forwarded-Proto $scheme;                    # Annahme A2
}

# -----------------------------------------------------------------------------
# 503: alle übrigen API-Pfade (kurze JSON-Antwort)
# -----------------------------------------------------------------------------
# "^~" beendet die Suche: Kein regulärer Ausdruck oben kann einen /api/-Pfad
# doch noch freigeben. Bestellungen, Anmeldung, Registrierung, Gastkonten,
# Kontaktformular, Chat, Artikeldaten: alles gesperrt, für jede Methode.
location ^~ /api/ {
    error_page 503 /__tk_offline_503.json;
    return 503;
}

# -----------------------------------------------------------------------------
# 503: alles andere (Offline-Seite als Inhalt)
# -----------------------------------------------------------------------------
# Shop, Marktpfade, Rechner, Konto, Portale, Partnerseiten, /myadmin, alle
# *.dc.html, /assets/*, /vendor/*, unbekannte Pfade. Keine Weiterleitung (301),
# kein 410.
location / {
    return 503;
}
